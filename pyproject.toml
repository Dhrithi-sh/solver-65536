[project]
name = "solver-65536"
version = "0.1.0"
description = "AI agents for 2048 on a 4x4 board, pushing toward the 65,536 tile"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["engine*", "agents*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
